# Example config for pmx. Copy to ~/.config/pmx/config.yml and edit.
proxmox_ssh_host: root@192.168.9.12
proxmox_api_host: 192.168.9.12
default_node: pve01
default_storage: bwrx
default_lxc_storage: cephfs
default_bridge: vmbr0
ad_domain: broken.wrx
ad_realm: BROKEN.WRX
ad_join_user: jtd
# Ceph monitors, named in every guest's CephFS mount source. The workstation is
# NOT a Ceph client: each guest that asks for --cephfs gets its own CephX
# identity (client.<name>) minted on the node, scoped to the subpaths it asked
# for, and removed again by `pmx destroy`.
ceph_mons:
  - 192.168.9.11
  - 192.168.9.12
  - 192.168.9.13
  - 192.168.9.14
# Key type for those identities. Optional, default aes256k (the only cipher
# the cluster allows); `aes` only works against a cluster that still allows it.
# cephx_key_type: aes256k
state_log_path: state/guests.jsonl
# ssh target for the Samba AD DC. `pmx destroy` ssh'es here to remove a guest's
# DNS A/PTR and AD computer object with the DC's own root tooling (samba-tool /
# nsupdate -l), so the account needs passwordless sudo on the DC. Omit to skip
# DC-side cleanup.
dc_ssh_host: sysop@192.168.9.20
