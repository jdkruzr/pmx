---
# PVE's cloud-init user-data sets package_upgrade: true, so a fresh VM is running
# its own dnf upgrade at first boot. Two dnf transactions at once end in
# "package not installed" / "No such file or directory: .../packages/*.rpm".
# Ubuntu has always waited here; Rocky did not.
- name: Wait for cloud-init to finish (VM only)
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false
  when: guest_kind == "vm"

# Plain dnf rather than the dnf module: its failure output is the real dnf
# output, and `changed` follows "Nothing to do" rather than module heuristics.
- name: dnf upgrade
  ansible.builtin.command: dnf -y upgrade --refresh
  register: dnf_upgrade
  changed_when: "'Nothing to do' not in dnf_upgrade.stdout"

- name: Install base packages
  ansible.builtin.dnf:
    name: >-
      {{ common_base_packages_rocky
         | reject('equalto','qemu-guest-agent')
         | list if guest_kind == 'lxc'
         else common_base_packages_rocky }}
    state: present

- name: Enable and start qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
    enabled: true
  when: guest_kind == "vm"

# Disks are attached with discard=on; the periodic fstrim hands freed blocks
# back to RBD so images stop growing monotonically.
- name: Enable periodic fstrim
  ansible.builtin.systemd:
    name: fstrim.timer
    state: started
    enabled: true
  when: guest_kind == "vm"
