---
# Default values for mount_cephfs role.
#
# Every guest that mounts CephFS gets its own CephX identity, `client.<guest_name>`,
# minted on the Proxmox node with `ceph fs authorize` and scoped to exactly the
# subpaths it asked for. The workstation is NOT a Ceph client and holds no secret.
ceph_mons:
  - 192.168.9.11
  - 192.168.9.12
  - 192.168.9.13
  - 192.168.9.14
cephfs_fs_name: cephfs

# Key type for the minted identity. The cluster allows aes256k only; a 7.0
# kernel (common role installs the HWE kernel on Ubuntu VMs) and Tentacle's
# mount.ceph (repo below) are what a guest needs to use it.
cephx_key_type: aes256k

# VM path: kernel mount inside the guest with the guest's own secret.
# recover_session=clean lets the kernel client re-establish a session cleanly if
# the MDS ever blocklists it instead of leaving the mount wedged.
cephfs_secret_path: "/etc/ceph/{{ guest_name }}.secret"
cephfs_mount_opts: >-
  name={{ guest_name }},secretfile={{ cephfs_secret_path }},fs={{ cephfs_fs_name }},noatime,_netdev,recover_session=clean

# LXC path: unprivileged containers can't run the kernel client, so the node
# mounts the subtree (per guest, so no two containers share a key) and binds it
# in. The secret lives on pmxcfs, which is why the mount must wait for
# pve-cluster.service at node boot.
cephfs_lxc_secret_path: "/etc/pve/priv/ceph/pmx-{{ guest_name }}.secret"
cephfs_lxc_mount_root: "/mnt/pmx-passthrough/{{ guest_name }}"
cephfs_lxc_mount_opts: >-
  name={{ guest_name }},secretfile={{ cephfs_lxc_secret_path }},fs={{ cephfs_fs_name }},noatime,_netdev,recover_session=clean,x-systemd.requires=pve-cluster.service
