---
# LXC CephFS mount path (delegated to host).
# Unprivileged containers can't run the kernel CephFS client, so the node mounts
# each requested subtree — per guest, with the guest's own CephX identity — under
# /mnt/pmx-passthrough/<guest_name>/<subpath> and binds it into the container via
# mp<N>: lines in /etc/pve/lxc/<vmid>.conf.

- name: Delegate host-side work to the Proxmox node
  delegate_to: "{{ target_node }}"
  become: false
  block:

    - name: Mint or reconcile the guest's CephX identity
      ansible.builtin.include_tasks: cephx.yml

    # pmxcfs (/etc/pve) refuses the copy module's atomic temp-file rename
    # ("Operation not permitted" on .ansible_tmp*), so write the file directly.
    # /etc/pve/priv is root-only by construction; pmxcfs fixes ownership itself.
    - name: Install the guest's CephX secret on the node (pmxcfs, root-only)
      ansible.builtin.shell: |
        set -e
        f={{ cephfs_lxc_secret_path | quote }}
        if [ -f "$f" ] && [ "$(cat "$f")" = "$CEPHX_SECRET" ]; then
          echo unchanged
        else
          umask 077; printf '%s' "$CEPHX_SECRET" > "$f"; echo written
        fi
      args:
        executable: /bin/bash
      environment:
        CEPHX_SECRET: "{{ cephx_secret }}"
      register: cephx_secret_file
      changed_when: "'written' in cephx_secret_file.stdout"
      no_log: true

    - name: Find live host mounts for this guest
      ansible.builtin.shell: >-
        findmnt -rn -t ceph -o TARGET | grep '^{{ cephfs_lxc_mount_root }}/' || true
      register: lxc_live_mounts
      changed_when: false

    # The container's bind pins the CephFS superblock, so it has to stop before
    # the host mount can be torn down for a fresh session with the new secret.
    - name: Stop container before re-authenticating its mounts
      ansible.builtin.command: "pct stop {{ guest_vmid }}"
      when: cephx_secret_file.changed and lxc_live_mounts.stdout_lines | length > 0
      failed_when: false
      changed_when: true

    - name: Unmount stale sessions after a secret change
      ansible.posix.mount:
        path: "{{ item }}"
        state: unmounted
      loop: "{{ lxc_live_mounts.stdout_lines }}"
      when: cephx_secret_file.changed

    - name: Ensure mount directories exist on host
      ansible.builtin.file:
        path: "{{ cephfs_lxc_mount_root }}{{ item.subpath }}"
        state: directory
        mode: "0755"
      loop: "{{ cephfs_specs }}"

    - name: Mount CephFS subpaths on the host
      ansible.posix.mount:
        path: "{{ cephfs_lxc_mount_root }}{{ item.subpath }}"
        src: "{{ ceph_mons | join(',') }}:6789:{{ item.subpath }}"
        fstype: ceph
        opts: "{{ cephfs_lxc_mount_opts }}"
        state: mounted
      loop: "{{ cephfs_specs }}"

    - name: Assert each host mount authenticates as {{ cephx_entity }}
      ansible.builtin.shell: |
        set -o pipefail
        findmnt -rn -t ceph -o OPTIONS {{ (cephfs_lxc_mount_root ~ item.subpath) | quote }} \
          | tr ',' '\n' | grep -qx name={{ guest_name | quote }}
      args:
        executable: /bin/bash
      loop: "{{ cephfs_specs }}"
      changed_when: false

    # Idempotent: a dest that already has an mp line is left alone, so a
    # reconfigure run never appends duplicates.
    - name: Ensure an mp line per mount in the container config
      ansible.builtin.shell: |
        set -e
        conf=/etc/pve/lxc/{{ guest_vmid }}.conf
        changed=0
        {% for s in cephfs_specs %}
        if ! grep -qE '^mp[0-9]+: .*,mp={{ s.dest }}(,|$)' "$conf"; then
          for i in $(seq 0 255); do grep -qE "^mp${i}:" "$conf" || break; done
          echo "mp${i}: {{ cephfs_lxc_mount_root }}{{ s.subpath }},mp={{ s.dest }},ro=0" >> "$conf"
          changed=1
        fi
        {% endfor %}
        echo "changed=$changed"
      register: mp_result
      changed_when: "'changed=1' in mp_result.stdout"

    - name: Restart container so new mp lines or a fresh mount take effect
      ansible.builtin.shell: |
        pct stop {{ guest_vmid }} || true
        pct start {{ guest_vmid }}
      when: mp_result.changed or cephx_secret_file.changed
      changed_when: true
