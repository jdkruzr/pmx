---
# Destroy sequence:
#   1. DC-side cleanup (on the Samba AD DC): delete DNS A + PTR + computer object
#   2. stop + destroy the Proxmox resource on the node
#
# The DC-side step ssh'es to the Samba AD DC ({{ dc_ssh_host }}) and runs the
# canonical local tooling there as root: samba-tool (machine account) for the
# AD-integrated forward zone and the computer object, and nsupdate -l (the BIND
# session key) for the classic reverse zone. Running on the DC against the local
# databases means no Kerberos password is needed and it works even when the
# guest is already powered off — so there is no guest-side step and no AD
# credential prompt on destroy. Every sub-step is idempotent and non-fatal: a
# leftover must never block a teardown. The logic lives in files/dc_dereg.sh and
# is piped to the DC's shell over ssh (no copy/deploy step required).
#
# The task is gated on `domain_join`, which pmx sets false when dc_ssh_host is
# unset, so this whole play no-ops for non-joined guests or unconfigured DCs.

- name: DC-side AD + DNS cleanup (if domain-joined)
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Deregister DNS (A + PTR) and AD computer object on the Samba DC
      ansible.builtin.shell: >-
        ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=10
        {{ dc_ssh_host }} sudo bash -s --
        {{ guest_name | quote }} {{ guest_ip | default('', true) | quote }} {{ ad_domain | quote }}
        < {{ (playbook_dir ~ '/../files/dc_dereg.sh') | quote }}
      args:
        executable: /bin/bash
      when: domain_join | bool
      register: dc_dereg
      changed_when: dc_dereg.rc == 0
      failed_when: false

    # dc_dereg.sh always exits 0 when it runs (its own steps are non-fatal), so a
    # non-zero rc here means the ssh transport to the DC failed and NOTHING was
    # cleaned up. Surface that loudly rather than letting failed_when:false hide it
    # — but still never block the Proxmox destroy that follows.
    - name: Report DC-side cleanup result
      ansible.builtin.debug:
        msg: >-
          {{ dc_dereg.stdout_lines
             if (dc_dereg.rc | default(1)) == 0
             else ['WARNING: DC-side deregistration did NOT run (rc='
                   ~ (dc_dereg.rc | default('?')) ~ '). AD/DNS records for '
                   ~ guest_name ~ ' may still exist; check ' ~ dc_ssh_host
                   ~ ' reachability and sudo.'] + (dc_dereg.stderr_lines | default([])) }}
      when: domain_join | bool and dc_dereg is defined

- name: Destroy Proxmox resource
  hosts: "{{ target_node }}"
  gather_facts: false
  become: false
  tasks:
    - name: Stop VM
      ansible.builtin.command: "qm stop {{ guest_vmid }}"
      when: guest_kind == 'vm'
      failed_when: false
      changed_when: true

    - name: Destroy VM
      ansible.builtin.command: "qm destroy {{ guest_vmid }} --purge"
      when: guest_kind == 'vm'
      changed_when: true

    - name: Stop LXC
      ansible.builtin.command: "pct stop {{ guest_vmid }}"
      when: guest_kind == 'lxc'
      failed_when: false
      changed_when: true

    - name: Destroy LXC
      ansible.builtin.command: "pct destroy {{ guest_vmid }} --purge"
      when: guest_kind == 'lxc'
      changed_when: true
