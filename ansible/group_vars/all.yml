# Defaults shared across all plays. Override per-run with -e extra vars.
ad_domain: broken.wrx
ad_realm: BROKEN.WRX
ad_join_user: jtd

default_storage: bwrx
default_lxc_storage: cephfs
default_bridge: vmbr0

# Ceph. The workstation is not a Ceph client: each CephFS guest gets its own
# `client.<guest_name>` identity minted on the node (see roles/mount_cephfs).
ceph_mons:
  - 192.168.9.11
  - 192.168.9.12
  - 192.168.9.13
  - 192.168.9.14
cephfs_fs_name: cephfs
# The cluster allows aes256k only; Ubuntu VMs get the HWE 7.0 kernel first.
cephx_key_type: aes256k
